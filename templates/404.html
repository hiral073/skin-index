{% extends "base.html" %}

{% block title %}Not found · Skin Index{% endblock %}

{% block content %}
<section class="products-page">
    <div class="empty-state">
        <h1 class="page-title">We couldn't find that</h1>
        <p>The page or product you are looking for does not exist.</p>
        <p class="empty-hint">It may have been removed, or the link may be wrong.</p>
        <p class="not-found-action"><a class="btn-primary" href="{{ url_for('products') }}">Back to products</a></p>
    </div>
</section>
{% endblock %}
